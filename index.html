<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
<title>736 Arlington Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: full-height planner — top tool bar, catalog/rooms panel left, 3D stage centre, inspector right, file bar bottom. */
:root{
  --bg:#EEF1ED; --panel:#F8FAF7; --ink:#1D2925; --muted:#5C6B65; --line:#D3DBD5;
  --accent:#2F6B57; --accent-soft:#DCEBE3; --on-accent:#FFFFFF; --est:#A0532F; --sky:#D9E4E6;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111815; --panel:#18201C; --ink:#E3EBE7; --muted:#93A39C; --line:#2B3732;
  --accent:#6DB797; --accent-soft:#21362D; --on-accent:#0E1512; --est:#E0956E; --sky:#1B2427; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111815; --panel:#18201C; --ink:#E3EBE7; --muted:#93A39C; --line:#2B3732;
  --accent:#6DB797; --accent-soft:#21362D; --on-accent:#0E1512; --est:#E0956E; --sky:#1B2427; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13px;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:11.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:6px 11px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.grp{display:flex;align-items:center;gap:6px}
.grp>small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);user-select:none;cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
.mobile-only{display:none}
.panel-close{display:none;align-self:flex-end;margin:8px 12px 0;flex:none}
.stage{display:grid;grid-template-columns:260px 1fr 280px;min-height:0;position:relative}
.panel{background:var(--panel);border-right:1px solid var(--line);overflow:auto;min-height:0;display:flex;flex-direction:column}
#right{border-right:0;border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;border:0;background:none;padding:10px 6px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
h3{font-family:var(--f-display);font-size:13px;font-weight:600;margin:0;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
h2{font-family:var(--f-display);font-size:18px;font-weight:600;margin:0;text-wrap:balance}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lib button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:8px 9px}
.lib button:hover{border-color:var(--accent)}
.lib button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lib b{font-weight:600;font-size:12.5px}
.lib small,.mono{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:12px;line-height:1.5}
.rooms details{border-bottom:1px solid var(--line);padding:6px 0}
.rooms summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;padding:3px 0}
.rooms summary::-webkit-details-marker{display:none}
.rooms summary .nm{flex:1;min-width:0;font-weight:500}
.count{font-family:var(--f-mono);font-size:10.5px;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:1px 7px}
.rooms ul{list-style:none;margin:4px 0 2px 14px;padding:0;display:flex;flex-direction:column;gap:2px}
.rooms li button{border:0;background:none;padding:2px 4px;text-align:left;color:var(--muted);width:100%;border-radius:4px}
.rooms li button:hover{background:var(--accent-soft);color:var(--ink)}
.lvl-h{margin-top:6px}
#view{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--sky)}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line);border-radius:6px;padding:2px 6px;line-height:1.2}
.lbl b{display:block;font-size:11.5px;font-weight:600}
.lbl span{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.lbl.est span{color:var(--est)}
.lbl.site{background:none;border:0;color:var(--ink);opacity:.8}
.lbl.site b{font-weight:500;font-size:11px}
#toast{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:var(--r);font-size:12px;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:.94}
#walkpad{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,42px);gap:4px}
#walkpad button{height:42px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);font-size:16px}
#walkpad .sp{visibility:hidden}
#viewhint{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:10px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:4px 8px;border-radius:6px;pointer-events:none;max-width:calc(100% - 24px)}
.field{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.field label,.row label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
input[type=number],input[type=text],select{width:100%;min-width:0;padding:6px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input[type=color]{width:42px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.row>*{min-width:0}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--est)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.swatches button{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);padding:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10px;border-radius:4px;padding:1px 5px;background:var(--accent-soft);color:var(--accent)}
.tag.est{background:color-mix(in srgb,var(--est) 16%,transparent);color:var(--est)}
.facts{display:flex;flex-direction:column;gap:6px;font-size:12px;line-height:1.45}
.facts p{margin:0}
.facts a{color:var(--accent)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--panel)}
#status{margin-left:auto;color:var(--muted);font-size:12px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:18px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog textarea{width:100%;min-height:220px;box-sizing:border-box;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:8px}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:10px}
.tabs button{padding-inline:4px}
.btn[aria-pressed="true"]{background:var(--est);border-color:var(--est);color:var(--panel)}
.pin{position:absolute;transform:translate(-50%,-135%);width:24px;height:24px;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--est);color:var(--panel);border:2px solid var(--panel);font:600 11px var(--f-body);padding:0;pointer-events:auto;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35)}
#noteText{min-height:110px;font-family:var(--f-body);font-size:13px}
.notes{display:flex;flex-direction:column;gap:6px}
.notes button{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:8px}
.notes .pin-n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--est);color:var(--panel);font:600 11px/20px var(--f-body);text-align:center}
.notes .nt{display:flex;flex-direction:column;gap:2px;min-width:0}
.notes b{font-weight:500}
.notes small{color:var(--muted);font-size:11px}
@media (max-width:900px){
  .stage{grid-template-columns:1fr}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:58%;z-index:5;border:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12)}
  #right{border-left:0}
  .panel:not(.open){display:none}
  .mobile-only{display:inline-flex}
  .panel-close{display:block}
  .brand{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <div class="brand"><b>736 Arlington Rd</b><span>Redwood City · 4 bd + 2 offices / 3 ba · 4,205 sq ft · 2 levels · 1:1 scale</span></div>
    <div class="grp"><small>View</small>
      <div class="seg" id="modeSeg">
        <button id="mode-orbit" data-mode="orbit" aria-pressed="true">3D</button>
        <button id="mode-plan" data-mode="plan" aria-pressed="false">Floor plan</button>
        <button id="mode-walk" data-mode="walk" aria-pressed="false">Walk</button>
      </div></div>
    <div class="grp"><small>Level</small>
      <div class="seg" id="lvlSeg">
        <button id="lvl-all" data-lvl="all" aria-pressed="true">Both</button>
        <button id="lvl-0" data-lvl="0" aria-pressed="false">Main</button>
        <button id="lvl-1" data-lvl="1" aria-pressed="false">Upper</button>
      </div></div>
    <div class="grp" style="flex-wrap:wrap">
      <label class="chk"><input type="checkbox" id="tRoof" checked>Roof</label>
      <label class="chk"><input type="checkbox" id="tCeil">Ceilings</label>
      <label class="chk"><input type="checkbox" id="tCut">Cutaway</label>
      <label class="chk"><input type="checkbox" id="tYard" checked>Yard</label>
      <label class="chk"><input type="checkbox" id="tLabels" checked>Labels</label>
    </div>
    <button class="btn" id="bMark" aria-pressed="false">Mark a spot</button>
    <button class="btn mobile-only" id="openLeft">Furniture &amp; rooms</button>
    <button class="btn mobile-only" id="openRight">Details</button>
  </header>

  <main class="stage">
    <aside class="panel" id="left">
      <button class="btn panel-close" id="closeLeft">Close ✕</button>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-lib" aria-selected="true" data-tab="lib">Furniture</button>
        <button role="tab" id="tab-rooms" aria-selected="false" data-tab="rooms">Rooms</button>
        <button role="tab" id="tab-notes" aria-selected="false" data-tab="notes">Marks</button>
        <button role="tab" id="tab-info" aria-selected="false" data-tab="info">Facts</button>
      </div>
      <div class="pane" id="pane-lib">
        <p class="hint">Pick a piece, then click a floor to drop it. Drag placed pieces to move them. <span class="mono">R</span> rotates 15°, <span class="mono">Del</span> removes.</p>
        <div class="lib" id="lib"></div>
      </div>
      <div class="pane rooms" id="pane-rooms" hidden></div>
      <div class="pane" id="pane-notes" hidden></div>
      <div class="pane" id="pane-info" hidden></div>
    </aside>

    <div id="view">
      <div id="labels"></div>
      <div id="viewhint"></div>
      <div id="walkpad" hidden>
        <span class="sp"></span><button id="wk-f" data-k="f" aria-label="Walk forward">▲</button><span class="sp"></span>
        <button id="wk-l" data-k="l" aria-label="Turn left">◀</button><button id="wk-b" data-k="b" aria-label="Walk back">▼</button><button id="wk-r" data-k="r" aria-label="Turn right">▶</button>
      </div>
      <div id="toast"></div>
    </div>

    <aside class="panel" id="right"><button class="btn panel-close" id="closeRight">Close ✕</button><div class="pane" id="insp"></div></aside>
  </main>

  <footer class="foot">
    <button class="btn" id="bSave">Save</button>
    <button class="btn" id="bExport">Export JSON</button>
    <button class="btn" id="bImport">Import JSON</button>
    <button class="btn danger" id="bReset">Reset to starter</button>
    <span id="status"></span>
  </footer>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle">Export layout</h2>
  <p class="hint" id="dlgHint"></p>
  <input type="file" id="dlgFile" accept=".json,application/json" hidden>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <div class="dlg-actions">
    <button class="btn" id="dlgClose">Close</button>
    <button class="btn" id="dlgCopy">Copy</button>
    <button class="btn" id="dlgPick" hidden>Choose file…</button>
    <button class="btn primary" id="dlgSaveFile" hidden>Save .json file</button>
    <button class="btn primary" id="dlgLoad" hidden>Load layout</button>
  </div>
</dialog>

<dialog id="noteDlg">
  <h2 id="noteTitle">Mark</h2>
  <p class="hint" id="noteWhere"></p>
  <textarea id="noteText" placeholder="What should change here? For example: this window is wider and reaches the floor."></textarea>
  <div class="dlg-actions">
    <button class="btn danger" id="noteDel">Delete mark</button>
    <button class="btn" id="noteCancel">Close</button>
    <button class="btn primary" id="noteSave">Save mark</button>
  </div>
</dialog>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= DATA (feet; x = east, y = south; origin = NW corner of house) =================
   Room sizes marked src:'plan' come from the listing's measured floor plan (Floor Plan Visuals, TourFactory #2912242).
   Everything else (halls, closets, baths, wall openings, heights) is scaled off that plan and is an estimate. */
const FT = 0.3048, M = v => v * FT;
const LEVELS = [
  { id: 0, name: 'Main level', base: 0, wallH: 10, ceil: 9 },
  { id: 1, name: 'Upper level', base: 10, wallH: 9, ceil: 8.5 },
];
const R = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
const ROOMS = [
  // main level
  { id: 'rec', name: 'Rec Room', level: 0, poly: R(0, 0, 27, 23), dims: [26, 21], src: 'plan', floor: 'walnut', vaulted: true, note: 'Vaulted dark-wood ceiling, wet bar, French doors to terrace' },
  { id: 'sitarea', name: 'Bedroom 5', level: 0, poly: R(0, 23, 11, 39.3), src: 'est', floor: 'oak', ceilH: 8.4, note: 'Your renovation: the bar and sitting area (plan: 10′ × 10′ + bar) enclosed as a bedroom. Wall and door position assumed.' },
  { id: 'family', name: 'Family Room', level: 0, poly: [[11, 23], [27, 23], [29.6, 57.7], [12, 57.7], [12, 39.3], [11, 39.3]], dims: [15, 31], src: 'plan', floor: 'oak', ceilH: 9.85, woodCeil: true, note: 'Fieldstone fireplace, wood ceiling with beams, clerestory windows, French doors to pool deck' },
  { id: 'bed4', name: 'Bedroom 4', level: 0, poly: R(0, 39.3, 12, 54.4), dims: [11, 14], src: 'plan', floor: 'oak', ceilH: 8.4 },
  { id: 'bath1', name: 'Bath', level: 0, poly: R(0, 56.6, 9.7, 62), src: 'est', floor: 'tile' },
  { id: 'kitchen', name: 'Kitchen', level: 0, poly: [[0, 54.4], [12, 54.4], [12, 57.7], [27, 57.7], [27, 70.6], [0, 70.6], [0, 62], [9.7, 62], [9.7, 56.6], [0, 56.6]], dims: [26, 11], src: 'plan', floor: 'stone', note: 'Marble counters, gas range' },
  { id: 'mech', name: 'Mech Room', level: 0, poly: R(0, 70.6, 7.7, 76.2), src: 'est', floor: 'concrete' },
  { id: 'laundry', name: 'Laundry', level: 0, poly: R(7.7, 70.6, 10.2, 76.2), src: 'est', floor: 'tile' },
  { id: 'pantry', name: 'Pantry', level: 0, poly: R(13.9, 70.6, 17.9, 76.2), src: 'est', floor: 'stone' },
  { id: 'stairs', name: 'Stairs', level: 0, poly: R(18.4, 70.6, 26.8, 76.5), src: 'est', floor: 'oak', noCeil: true },
  { id: 'dining', name: 'Dining Room', level: 0, poly: R(27, 57.7, 39, 70.4), dims: [11, 13], src: 'plan', floor: 'oak', note: 'Your renovation: wall to the kitchen removed, one open space' },
  { id: 'closet1', name: 'Closet', level: 0, poly: R(27, 70.4, 31, 75.5), src: 'est', floor: 'oak' },
  { id: 'wic1', name: 'Walk-in Closet', level: 0, poly: R(35, 70.4, 39, 75.5), src: 'est', floor: 'oak' },
  { id: 'foyer', name: 'Foyer', level: 0, poly: [[10.2, 70.6], [13.9, 70.6], [13.9, 76.2], [17.9, 76.2], [17.9, 76.5], [27, 76.5], [27, 75.5], [31, 75.5], [31, 70.4], [35, 70.4], [35, 75.5], [39, 75.5], [39, 81.9], [12.8, 81.9], [12.8, 76.2], [10.2, 76.2]], src: 'est', floor: 'marble' },
  { id: 'sitroom', name: 'Office (sunroom)', level: 0, poly: [[39, 57.7], [60.7, 57.7], [61.5, 66], [39, 66]], dims: [21, 8], src: 'plan', floor: 'terracotta', plankCeil: true, note: 'Terracotta tile, wall of windows to the pool' },
  { id: 'living', name: 'Living Room', level: 0, poly: R(39, 66, 63, 83.7), dims: [23, 16], src: 'plan', floor: 'oak', note: 'Fireplace on east wall' },
  { id: 'bed3', name: 'Office 2', level: 0, poly: R(0, 76.2, 12.8, 93.2), dims: [11, 16], src: 'plan', floor: 'oak' },
  // upper level
  { id: 'wic', name: 'Primary WIC', level: 1, poly: R(0, 53.7, 13.4, 59.6), src: 'est', floor: 'oak' },
  { id: 'primary', name: 'Primary Suite', level: 1, poly: R(0, 59.6, 13.4, 81.9), dims: [13, 22], src: 'plan', floor: 'oak', note: 'Fireplace, skylights' },
  { id: 'mech2', name: 'Mech', level: 1, poly: R(13.4, 53.7, 16.5, 57.5), src: 'est', floor: 'concrete' },
  { id: 'pbath', name: 'Primary Bath', level: 1, poly: R(13.4, 57.5, 26, 68.5), src: 'est', floor: 'marble', note: 'Oversized tub, stall shower, double sinks' },
  { id: 'bed2', name: 'Bedroom 2', level: 1, poly: R(26, 57.5, 37.6, 72.7), dims: [11, 13], src: 'plan', floor: 'oak' },
  { id: 'bath2', name: 'Bath', level: 1, poly: R(29.9, 72.7, 37.6, 81.9), src: 'est', floor: 'tile' },
  { id: 'hall2', name: 'Upper Hall', level: 1, poly: [[13.4, 68.5], [26, 68.5], [26, 72.7], [29.9, 72.7], [29.9, 81.9], [13.4, 81.9]], src: 'est', floor: 'oak', holes: [R(18.4, 70.6, 26.8, 76.5)] },
  { id: 'balcony', name: 'Covered Balcony', level: 1, poly: R(16.5, 53.7, 37.6, 57.5), src: 'est', floor: 'terracotta', outdoor: true },

const $ = id => document.getElementById(id);
function inPoly(x, y, poly) { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
function area(poly) { let a = 0; for (let i = 0; i < poly.length; i++) { const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length]; a += x1 * y2 - x2 * y1; } return Math.abs(a / 2); }
function centroid(r) { if (r.label) return r.label; const p = r.poly; let x = 0, y = 0; p.forEach(q => { x += q[0]; y += q[1]; }); let c = [x / p.length, y / p.length]; if (!inPoly(c[0], c[1], p)) { const xs = p.map(q => q[0]), ys = p.map(q => q[1]); c = [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2]; } return c; }

  el.append(dl);
}
$('pane-info').innerHTML = `

/* ================= TOP BAR / FOOTER ================= */
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('#lvlSeg button').forEach(b => b.onclick = () => setLevel(b.dataset.lvl));
[['tRoof', 'roof'], ['tCeil', 'ceil'], ['tCut', 'cut'], ['tYard', 'yard'], ['tLabels', 'labels']].forEach(([id, k]) => $(id).onchange = () => { ui[k] = $(id).checked; if (k === 'roof' && ui.roof && level !== 'all') setLevel('all'); applyVis(); });
$('openLeft').onclick = () => { $('right').classList.remove('open'); $('left').classList.toggle('open'); };
$('openRight').onclick = () => { $('left').classList.remove('open'); $('right').classList.toggle('open'); };
$('closeLeft').onclick = $('closeRight').onclick = closeSheets;
$('bSave').onclick = () => save(true);
let resetArm = 0;
$('bReset').onclick = () => { if (Date.now() - resetArm < 3000) { resetArm = 0; $('bReset').textContent = 'Reset to starter'; starter = true; loadState({ items: starterItems(), rooms: {}, notes: state.notes, m: 2 }, 'Starter layout restored'); save(true); starter = true; setStatus(); return; } resetArm = Date.now(); $('bReset').textContent = 'Click again to reset'; setTimeout(() => { $('bReset').textContent = 'Reset to starter'; }, 3000); };
const dlg = $('dlg');
function openDlg(kind) {
  const exp = kind === 'export'; $('dlgTitle').textContent = exp ? 'Export layout' : 'Import layout';
  $('dlgHint').textContent = exp ? 'Your furniture, paint and floor choices as JSON. Copy it or save it as a file, then import it later or on another device.' : 'Choose a .json file you exported, or paste its contents below, then load it. This replaces the current layout.';
  $('dlgText').value = exp ? JSON.stringify(state, null, 1) : ''; $('dlgText').readOnly = exp;
  $('dlgSaveFile').hidden = !exp; $('dlgLoad').hidden = exp; $('dlgPick').hidden = exp; $('dlgCopy').hidden = !exp;
  dlg.showModal();
}
$('bExport').onclick = () => openDlg('export');
$('bImport').onclick = () => openDlg('import');
$('dlgClose').onclick = () => dlg.close();
$('dlgCopy').onclick = () => { const t = $('dlgText'); navigator.clipboard?.writeText(t.value).then(() => toast('Layout copied'), () => { t.select(); toast('Select-all done · press Ctrl/Cmd+C'); }) ?? (t.select(), toast('Press Ctrl/Cmd+C to copy')); };
$('dlgSaveFile').onclick = () => { try { const url = URL.createObjectURL(new Blob([$('dlgText').value], { type: 'application/json' })), a = document.createElement('a'); a.href = url; a.download = '736-arlington-layout.json'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Layout downloaded'); } catch (e) { toast('Download failed · use Copy'); } };
$('dlgPick').onclick = () => $('dlgFile').click();
$('dlgFile').onchange = () => { const f = $('dlgFile').files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('dlgText').value = rd.result; }; rd.readAsText(f); };
$('dlgLoad').onclick = () => { try { const o = JSON.parse($('dlgText').value); if (!o || !Array.isArray(o.items)) throw 0; loadState(o, `Imported ${o.items.length} pieces`); save(true); dlg.close(); } catch (e) { toast('That is not a layout file. Export one from this page first.'); } };

/* ================= MARKS: pin a spot and write what should change there ================= */
const pinMat = new THREE.MeshBasicMaterial({ color: 0xC8402A, depthTest: false });
const pins = new Map(); let marking = false, editing = null;
function setMarking(on) { marking = !!on; $('bMark').setAttribute('aria-pressed', marking); view.style.cursor = marking ? 'crosshair' : ''; if (marking) { stopPlacing(); toast('Click the exact spot you want changed · Esc cancels'); } }
function noteWhere(n) { const L = LEVELS[n.level], r = roomAt(n.level, n.x / FT, n.z / FT), up = Math.max(0, n.y / FT - (r ? L.base : 0)).toFixed(1); return `${r ? r.name + ' · ' + L.name.toLowerCase() : 'Outside'} · ${(n.x / FT).toFixed(1)}′ east, ${(n.z / FT).toFixed(1)}′ south of the house's NW corner · ${up}′ above the ${r ? 'floor' : 'ground'}`; }
function syncPins() {
  for (const p of pins.values()) { scene.remove(p.mesh); p.el.remove(); } pins.clear();
  (state.notes || []).forEach((n, i) => { const m = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), pinMat); m.position.set(n.x, n.y, n.z); m.renderOrder = 20; scene.add(m);
    const el = document.createElement('button'); el.className = 'pin'; el.textContent = i + 1; el.title = n.text || 'Mark ' + (i + 1); el.onclick = () => openNote(n, false); $('labels').append(el); pins.set(n.id, { mesh: m, el, note: n }); });
  renderNotes();
}
const pinV = new THREE.Vector3();
function updatePins() { const w = view.clientWidth, h = view.clientHeight; for (const p of pins.values()) { let show = G.levels[p.note.level].visible; if (show) { pinV.copy(p.mesh.position).project(camera); show = pinV.z < 1 && Math.abs(pinV.x) < 1 && Math.abs(pinV.y) < 1; } p.mesh.visible = show; p.el.hidden = !show; if (show) { p.el.style.left = ((pinV.x + 1) / 2 * w) + 'px'; p.el.style.top = ((1 - pinV.y) / 2 * h) + 'px'; } } }
function addNoteAt() {
  const hit = raycaster.intersectObjects([G.levels[0], G.levels[1], G.roof, G.site], true).find(h => visibleChain(h.object));
  if (!hit) { toast('Nothing there to mark. Click a wall, floor, roof or the yard.'); return; }
  const p = hit.point, n = { id: 'n' + Date.now().toString(36), x: +p.x.toFixed(3), y: +p.y.toFixed(3), z: +p.z.toFixed(3), level: p.y >= M(LEVELS[1].base) - 0.05 ? 1 : 0, text: '' };
  state.notes.push(n); setMarking(false); syncPins(); openNote(n, true);
}
function openNote(n, isNew) { editing = { n, isNew, kept: false }; $('noteTitle').textContent = 'Mark ' + (state.notes.indexOf(n) + 1); $('noteWhere').textContent = noteWhere(n); $('noteText').value = n.text || ''; $('noteDel').hidden = isNew; $('noteDlg').showModal(); $('noteText').focus(); }
$('noteSave').onclick = () => { if (!editing) return; editing.n.text = $('noteText').value.trim(); editing.kept = true; $('noteDlg').close(); };
$('noteCancel').onclick = () => $('noteDlg').close();
$('noteDel').onclick = () => { if (!editing) return; state.notes = state.notes.filter(x => x !== editing.n); editing.kept = true; $('noteDlg').close(); toast('Mark removed'); };
$('noteDlg').addEventListener('close', () => { if (editing && editing.isNew && !editing.kept) state.notes = state.notes.filter(x => x !== editing.n); editing = null; syncPins(); save(true); });
$('bMark').onclick = () => setMarking(!marking);
function notesText() { return state.notes.length ? 'Change requests for the 736 Arlington 3D model:\n' + state.notes.map((n, i) => `${i + 1}. [${noteWhere(n)}] ${n.text || '(no note written)'}`).join('\n') : ''; }
function renderNotes() {
  const el = $('pane-notes'); el.textContent = '';
  const hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = 'Press “Mark a spot”, click the part of the house you want changed, and write what should change. Then copy all marks and send them to Claude.'; el.append(hint);
  const row = document.createElement('div'); row.className = 'row';
  const b1 = document.createElement('button'); b1.className = 'btn primary'; b1.textContent = 'Mark a spot'; b1.onclick = () => setMarking(true);
  const b2 = document.createElement('button'); b2.className = 'btn'; b2.textContent = `Copy all marks (${state.notes.length})`; b2.disabled = !state.notes.length;
  b2.onclick = () => { $('dlgTitle').textContent = 'Your marks'; $('dlgHint').textContent = 'Paste this to Claude. Each line says where the spot is and what you want changed.'; $('dlgText').value = notesText(); $('dlgText').readOnly = true; $('dlgSaveFile').hidden = true; $('dlgLoad').hidden = true; $('dlgPick').hidden = true; $('dlgCopy').hidden = false; dlg.showModal(); $('dlgCopy').click(); };
  row.append(b1, b2); el.append(row);
  const list = document.createElement('div'); list.className = 'notes';
  state.notes.forEach((n, i) => { const b = document.createElement('button'); b.innerHTML = '<span class="pin-n"></span><span class="nt"><b></b><small></small></span>'; b.querySelector('.pin-n').textContent = i + 1; b.querySelector('b').textContent = n.text || '(no note written)'; b.querySelector('small').textContent = noteWhere(n); b.onclick = () => openNote(n, false); list.append(b); });
  el.append(list); const t = $('tab-notes'); if (t) t.textContent = state.notes.length ? `Marks ${state.notes.length}` : 'Marks';
}
// one-time update of layouts saved before the owner's room changes: sunroom office gets a standing desk, a grand piano goes by it, Bedroom 3 becomes an office
function migrate2() {
  const has = t => state.items.some(i => i.type === t), add = (t, room, x, y, rot) => state.items.push(makeItem(t, M(x), M(y), ROOM[room].level, rot));
  if (!has('standing_desk')) add('standing_desk', 'sitroom', 45, 60, 0);
  if (!has('grand_piano')) add('grand_piano', 'living', 44, 69.4, 90);
  const bed = state.items.find(i => i.type === 'bed_queen' && roomOfItem(i) === ROOM.bed3);
  if (bed) { state.items = state.items.filter(i => i !== bed); add('desk', 'bed3', 6.4, 78.2, 0); add('chair', 'bed3', 6.4, 80.6, 180); add('shelf', 'bed3', 1, 86, 90); }
}

/* ================= LOOP ================= */
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  if (mode === 'walk') {
    const k = walk.keys, sp = (k.shift ? 3.2 : 1.8) * dt;
    if (k.arrowleft || k.q) walk.yaw += 1.8 * dt; if (k.arrowright || k.e) walk.yaw -= 1.8 * dt;
    const fx = -Math.sin(walk.yaw), fz = -Math.cos(walk.yaw);
    let mv = 0, st = 0; if (k.w || k.arrowup) mv += 1; if (k.s || k.arrowdown) mv -= 1; if (k.a) st -= 1; if (k.d) st += 1;
    persp.position.x += (fx * mv - fz * st) * sp; persp.position.z += (fz * mv + fx * st) * sp;
    persp.rotation.order = 'YXZ'; persp.rotation.set(walk.pitch, walk.yaw, 0);
  } else if (mode === 'orbit') orbitCtl.update(); else planCtl.update();
  updateDoors(dt);
  renderer.render(scene, camera); updateLabels(); updatePins();
  requestAnimationFrame(tick);
}

/* ================= BOOT ================= */
let saved = null; try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
if (saved && Array.isArray(saved.items)) loadState(saved); else { starter = true; loadState({ items: starterItems(), rooms: {}, m: 2 }); }
setStatus(saved ? 'Loaded your saved layout' : null);
$('viewhint').textContent = 'Drag to orbit · right-drag to pan · scroll to zoom · pick Main or Upper to look inside';
applyVis(); renderInspector(); renderRooms();
setMode('walk'); // open at the front door
window.__planner = { state: () => state, setMode, setLevel, select, startPlacing, scene, meshes, view: (px, py, pz, tx, ty, tz) => { persp.position.set(M(px), M(py), M(pz)); orbitCtl.target.set(M(tx), M(ty), M(tz)); orbitCtl.update(); } };
tick();
